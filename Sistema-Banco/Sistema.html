<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Sistema.css">
</head>
<body>
    <header class="header"></header>
    <main class="main">
        <div class="member-publi">
            <button class="area-member">Membros</button>
            <button class="area-publi">Publicações</button>
        </div>
        <div class="operations-members-publi">

            <!-- Area dos membros -->

            <div class="operations-members">
                <form id="invit-member" class="invit-member">
                    <h2>Adicionar membro</h2>
                    <div class="area-data-member">
                        <div class="area-input">
                            <label class="label-members">Nome:</label>
                            <input type="text" id="name-member" name="nameMember" class="input-members">
                        </div>
                        <div class="area-input">
                            <label class="label-members">Curso:</label>
                            <input type="text" id="curse-member" name="curseMember" class="input-members">
                        </div>
                        <div class="area-input">
                            <label class="label-members">Time:</label>
                            <input type="text" id="time-member" name="timeMember" class="input-members">
                        </div>
                    </div>
                    <button type="submit" id="button-submit-member">Enviar</button>
                </form>
                <div class="list-members">
                    <div class="member">
                        <span>Eric Lourenco Verissimo</span>
                        <span>Eng.Telecomunicações</span>
                        <div>
                            <button>Editar</button>
                            <button>Deletar</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Area das publicações -->

        </div>
    </main>

    <script src="Sistema.js"></script>
    <script src=""></script>
</body>
</html>
